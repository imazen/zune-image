name: Rust

on:
  push:
    branches: [ "main","dev","gif" ]
  pull_request:
    branches: [ "main","dev" ,"gif" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux i686 (32-bit overflow check)
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            packages: gcc-multilib
            test-bmp-only: true

          # macOS
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packages (Linux)
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Run tests (full workspace)
        if: ${{ !matrix.test-bmp-only }}
        shell: bash
        run: |
          cargo test --verbose --release --workspace --no-fail-fast \
            --exclude zune-benches \
            --target ${{ matrix.target }}

      - name: Run tests (zune-bmp only for 32-bit overflow validation)
        if: matrix.test-bmp-only
        shell: bash
        run: |
          cargo test --verbose --release -p zune-bmp \
            --target ${{ matrix.target }}
